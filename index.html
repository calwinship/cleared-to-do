<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f0d">
<title>Cleared To Do</title>
<meta name="description" content="Cleared To Do — your tasks, cleared to land.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0f0d'/%3E%3Crect x='5' y='9' width='22' height='6' rx='1' fill='%23d9ecc9'/%3E%3Crect x='5' y='18' width='22' height='6' rx='1' fill='%23efe3a0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f0d;
    --bay: #141a17;
    --rail: #232c27;
    --rail-hi: #2f3a34;
    --ink-dim: #a3b2a8;
    --ink: #c9d6cd;
    --phosphor: #8df0a8;
    --amber: #f2c14e;
    --paper-seq: #d9ecc9;
    --paper-seq-edge: #b9d6a5;
    --paper-hold: #efe3a0;
    --paper-hold-edge: #d8c873;
    --paper-ink: #1c261f;
    --paper-ink-dim: #36423a;
    --paper-rule: rgba(28, 38, 31, .22);
    --stamp: #9c1f18;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: var(--mono);
    font-size: 15px;
    line-height: 1.4;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }

  /* Header */
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 8px 0 14px; border-bottom: 1px solid var(--rail); }
  .brand h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .06em; color: #e8f1eb; text-transform: uppercase; }
  .brand p { margin: 2px 0 0; font-size: 12px; color: var(--ink-dim); letter-spacing: .04em; }
  .clock { text-align: right; font-size: 11px; color: var(--ink-dim); letter-spacing: .08em; white-space: nowrap; }
  .clock b { display: block; font-size: 18px; color: var(--phosphor); font-weight: 600; letter-spacing: .04em; }
  .clock span { color: var(--ink-dim); }

  /* Brain dump */
  .intake { margin-top: 18px; }
  .label { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .14em; color: var(--ink-dim); text-transform: uppercase; margin-bottom: 6px; }
  textarea {
    width: 100%; min-height: 168px; resize: vertical;
    background: #0f1512; color: var(--phosphor);
    border: 1px solid var(--rail-hi); border-radius: 6px;
    padding: 12px; font: 15px/1.5 var(--mono);
    caret-color: var(--phosphor);
  }
  textarea::placeholder { color: #7f9488; }
  textarea:focus { outline: 2px solid #3f7d55; outline-offset: 1px; }
  .btn {
    appearance: none; border: 0; cursor: pointer; font: 600 14px var(--mono); letter-spacing: .12em; text-transform: uppercase;
    border-radius: 6px; padding: 14px 16px; min-height: 48px;
  }
  .btn-primary { width: 100%; margin-top: 10px; background: var(--phosphor); color: #06200f; }
  .btn-primary:active { transform: translateY(1px); }
  .btn-primary[disabled] { background: #2d4436; color: #b8cdbf; cursor: progress; }
  .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--rail-hi); padding: 10px 12px; min-height: 40px; font-size: 12px; }
  .err { margin-top: 10px; padding: 10px 12px; border: 1px solid #6b2a24; background: #2a1513; color: #ffb4a8; border-radius: 6px; font-size: 13px; }

  /* Tower transmission */
  .tower { margin-top: 18px; border: 1px solid var(--rail-hi); border-radius: 6px; background: #0f1512; padding: 12px; }
  .tower .label { margin-bottom: 8px; }
  .tower .freq { color: var(--amber); }
  .tower blockquote { margin: 0; color: var(--phosphor); font-size: 17.5px; line-height: 1.55; }
  .tower-actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .btn-ghost[disabled] { color: var(--ink-dim); border-color: var(--rail); cursor: default; }
  .tower-actions .status { font-size: 11px; color: var(--ink-dim); letter-spacing: .08em; text-transform: uppercase; }
  .tx { display: inline-flex; align-items: center; gap: 6px; margin-right: 8px; }
  .tx::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--rail-hi); }
  .tx.on { color: #ff7a6b; }
  .tx.on::before { background: #ff5a4a; box-shadow: 0 0 6px #ff5a4a; animation: txpulse 1s ease-in-out infinite; }
  @keyframes txpulse { 50% { opacity: .3; box-shadow: none; } }
  #board.loading > :not(.tower), #board.loading .tower-actions { display: none; }

  /* Strip bays */
  .bay { margin-top: 20px; }
  .bay-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px 6px; border-bottom: 2px solid var(--rail-hi); margin-bottom: 8px; }
  .bay-head h2 { margin: 0; font-size: 13px; letter-spacing: .2em; color: #e8f1eb; }
  .bay-head span { font-size: 11px; color: var(--ink-dim); letter-spacing: .08em; }
  .rack { background: var(--bay); border-radius: 6px; padding: 6px; display: grid; gap: 6px; box-shadow: inset 0 0 0 1px var(--rail); }
  .empty { padding: 14px; font-size: 12px; color: var(--ink-dim); text-align: center; letter-spacing: .06em; }

  .strip {
    position: relative; display: grid;
    grid-template-columns: 44px 1fr auto;
    min-height: 74px;
    background: var(--paper-seq); color: var(--paper-ink);
    border-radius: 3px;
    border-left: 6px solid var(--paper-seq-edge);
    box-shadow: 0 1px 0 rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.35);
    transition: opacity .35s ease, transform .35s ease;
  }
  .strip.hold { background: var(--paper-hold); border-left-color: var(--paper-hold-edge); }
  .strip > div { padding: 8px; }
  .strip .no { border-right: 1px solid var(--paper-rule); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .strip .no b { font-size: 20px; font-weight: 700; line-height: 1; }
  .strip .no small { font-size: 9px; letter-spacing: .1em; color: var(--paper-ink-dim); }
  .strip .main { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  .strip .cs { font-size: 17px; font-weight: 700; letter-spacing: .05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip .task { font-size: 13px; color: var(--paper-ink-dim); overflow-wrap: anywhere; }
  .strip .meta { display: flex; gap: 10px; font-size: 11px; letter-spacing: .06em; color: var(--paper-ink-dim); text-transform: uppercase; flex-wrap: wrap; }
  .strip .meta .note { color: #7a5a00; }
  .strip .act { border-left: 1px solid var(--paper-rule); display: flex; flex-direction: column; justify-content: center; align-items: stretch; gap: 4px; padding: 6px; }
  .strip .act .row { display: flex; gap: 4px; }
  .strip .act .row > * { flex: 1; }
  .land {
    appearance: none; cursor: pointer; border: 1.5px solid var(--paper-ink); background: transparent; color: var(--paper-ink);
    font: 700 11px var(--mono); letter-spacing: .12em; padding: 0 10px; height: 40px; border-radius: 4px; text-transform: uppercase;
  }
  .land:active { background: var(--paper-ink); color: var(--paper-seq); }
  .land.sm { height: 30px; font-size: 10px; padding: 0 8px; border-width: 1px; }
  .strip.landed .land.sm:first-child { height: auto; min-height: 30px; padding: 4px 8px; max-width: 110px; line-height: 1.2; }
  .land.del { font-size: 13px; letter-spacing: 0; }
  .strip.cleared { box-shadow: 0 0 0 2px var(--phosphor), 0 2px 10px rgba(141,240,168,.25); }
  .strip.cleared .no small { color: #1d6b34; font-weight: 700; }
  .strip.promoted .no small { color: #1d6b34; }

  .strip.landed { opacity: .8; }
  .strip.landed .cs, .strip.landed .task { text-decoration: line-through; text-decoration-thickness: 2px; }
  .strip.landed.leaving .act { visibility: hidden; }
  .strip.landed::after {
    content: "LANDED"; position: absolute; right: 120px; top: 50%; transform: translateY(-50%) rotate(-8deg); pointer-events: none;
    border: 2px solid var(--stamp); color: var(--stamp); font: 700 13px var(--mono); letter-spacing: .18em; padding: 2px 6px; border-radius: 3px;
  }
  .strip.leaving { opacity: 0; transform: translateX(24px); }

  details.landed-bay { margin-top: 20px; }
  details.landed-bay summary { cursor: pointer; font-size: 12px; letter-spacing: .16em; color: var(--ink-dim); padding: 6px 2px; list-style: none; }
  details.landed-bay summary::-webkit-details-marker { display: none; }
  details.landed-bay summary::before { content: "▸ "; }
  details.landed-bay[open] summary::before { content: "▾ "; }

  .board-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 22px; }
  .board-actions .stamp { font-size: 11px; color: var(--ink-dim); letter-spacing: .06em; }

  .scanning { display: inline-block; width: 1ch; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .boot { margin-top: 28px; font-size: 12px; letter-spacing: .14em; color: var(--ink-dim); text-transform: uppercase; }
  .toast {
    position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 10;
    display: flex; align-items: center; gap: 14px;
    background: #1b231f; color: var(--ink); border: 1px solid var(--rail-hi); border-radius: 6px; padding: 8px 8px 8px 14px;
    font-size: 13px; letter-spacing: .04em; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.5);
  }
  .toast.error { background: #2a1513; color: #ffb4a8; border-color: #6b2a24; padding: 10px 14px; }
  .toast button { appearance: none; border: 1px solid var(--phosphor); background: transparent; color: var(--phosphor); font: 700 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; border-radius: 4px; padding: 0 12px; height: 36px; cursor: pointer; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); min-height: 40px; }
  .switch input { appearance: none; width: 36px; height: 20px; border-radius: 10px; background: var(--rail-hi); position: relative; margin: 0; cursor: pointer; transition: background .2s; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); transition: transform .2s; }
  .switch input:checked { background: #2f7a49; }
  .switch input:checked::after { transform: translateX(16px); background: var(--phosphor); }
  .switch input:focus-visible { outline: 2px solid var(--phosphor); outline-offset: 2px; }
  /* Radar */
  .radar { margin-top: 14px; position: relative; }
  .scope { display: block; width: 100%; max-width: 520px; margin: 0 auto; aspect-ratio: 1; touch-action: manipulation; }
  .scope-bg { fill: #07110b; stroke: var(--rail-hi); stroke-width: 3; }
  .scope .ring { fill: none; stroke: #1d3326; stroke-width: 2; }
  .scope .ring-label { fill: #6b8f77; font: 26px var(--mono); }
  .scope .tick { stroke: #2c4a37; stroke-width: 2; }
  .scope .runway { stroke: #a3b2a8; stroke-linecap: butt; }
  .scope .centreline { stroke: #2f5a3d; stroke-width: 2; stroke-dasharray: 10 10; }
  .scope .rwy-label { fill: #a3b2a8; font: 600 26px var(--mono); }
  .scope .sweep { stroke: rgba(141,240,168,.18); stroke-width: 3; }
  .scope .badge { fill: var(--phosphor); font: 600 28px var(--mono); letter-spacing: 2px; }
  .scope .badge.sim { fill: var(--amber); }
  .scope .range-label { fill: #a3b2a8; font: 600 28px var(--mono); }
  .scope .ac .blip { fill: none; stroke: #6f9a7c; stroke-width: 2.5; }
  .scope .ac .vec { stroke: #4f7a5d; stroke-width: 2; }
  .scope .ac .ac-label { fill: #8fb39b; font: 26px var(--mono); }
  .scope .ac.sim .blip { stroke: #b39443; }
  .scope .ac.sim .ac-label { fill: #b39443; }
  .scope .ac.paired .blip { stroke: #ff7a6b; stroke-width: 4; fill: rgba(255,90,74,.25); }
  .scope .ac.paired .ac-label { fill: #ffb4a8; font-weight: 700; }
  .scope .ac.paired .vec { stroke: #ff7a6b; }
  .scope .task { cursor: pointer; outline: none; }
  .scope .task .hit { fill: transparent; }
  .scope .task .tblip { fill: var(--phosphor); stroke: #06200f; stroke-width: 2; }
  .scope .task.hold .tblip { fill: var(--amber); }
  .scope .task .task-label { fill: #e8f1eb; font: 700 30px var(--mono); paint-order: stroke; stroke: #07110b; stroke-width: 5px; }
  .scope .task .sel-ring { fill: none; stroke: transparent; stroke-width: 3; }
  .scope .task.selected .sel-ring, .scope .task:focus-visible .sel-ring { stroke: #fff; }
  .scope .task.first .tblip { filter: drop-shadow(0 0 6px rgba(141,240,168,.9)); }
  .radar-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; font-size: 11px; color: var(--ink-dim); letter-spacing: .04em; }
  .radar-bar a { color: var(--ink-dim); }
  .radar-bar .btn-ghost { min-height: 36px; padding: 6px 10px; font-size: 11px; }
  .strip.selected { outline: 3px solid #fff; outline-offset: 2px; }
  .strip .main { cursor: pointer; }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .strip, .switch input, .switch input::after { transition: none; } .scanning, .tx.on::before { animation: none; } }
  @media (min-width: 900px) { .wrap { max-width: 600px; } }
  @media (min-width: 480px) { .strip { grid-template-columns: 52px 1fr auto; } .strip .cs { font-size: 18px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Cleared To Do</h1>
      <p>your tasks, cleared to land</p>
    </div>
    <div class="clock"><b id="local-clock" aria-label="Local time">--:--</b><span id="zulu" aria-label="UTC time">--:--Z</span> · TWR</div>
  </header>

  <section class="radar" aria-label="Radar">
    <div id="scope"></div>
    <div class="radar-bar">
      <span id="radar-credit">Connecting to traffic feed…</span>
      <button class="btn btn-ghost" id="range" type="button" aria-label="Change radar range">Range</button>
    </div>
  </section>

  <div id="boot" class="boot">Contacting tower<span class="scanning">_</span></div>

  <section id="intake" class="intake hidden">
    <div class="label"><label for="dump">Brain dump · all traffic</label><span id="count">0/2000</span></div>
    <textarea id="dump" maxlength="2000" placeholder="laundry, call mum back, taxes at some point, reply to Sam's email before 5, maybe learn spanish, buy milk"></textarea>
    <button id="request" class="btn btn-primary" type="button">Request clearance</button>
    <div id="error" class="err hidden" role="alert"></div>
  </section>

  <section id="board" class="hidden" aria-live="polite">
    <div class="tower">
      <div class="label"><span><span class="tx" id="tx" aria-hidden="true">TX</span>Tower transmission</span><span class="freq">118.300</span></div>
      <blockquote id="transmission"></blockquote>
      <div class="tower-actions" id="tower-actions">
        <label class="switch"><input type="checkbox" id="readback" role="switch"> Read back</label>
        <span class="status" id="voice-status"></span>
      </div>
    </div>

    <div class="bay">
      <div class="bay-head"><h2>SEQUENCE</h2><span id="seq-meta"></span></div>
      <div class="rack" id="seq"></div>
    </div>

    <div class="bay">
      <div class="bay-head"><h2>HOLDING</h2><span id="hold-meta"></span></div>
      <div class="rack" id="hold"></div>
    </div>

    <details class="landed-bay" id="landed-bay">
      <summary id="landed-summary">LANDED</summary>
      <div class="rack" id="landed"></div>
    </details>

    <div class="board-actions">
      <span class="stamp" id="stamp"></span>
      <button class="btn btn-ghost" id="new-board" type="button">New board</button>
    </div>
  </section>
  <div id="toast" class="toast hidden" role="status"></div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
