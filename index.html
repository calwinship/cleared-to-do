<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f0d">
<title>Cleared To Do</title>
<meta name="description" content="Cleared To Do — your tasks, cleared to land.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0f0d'/%3E%3Crect x='5' y='9' width='22' height='6' rx='1' fill='%23d9ecc9'/%3E%3Crect x='5' y='18' width='22' height='6' rx='1' fill='%23efe3a0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f0d;
    --bay: #141a17;
    --rail: #232c27;
    --rail-hi: #2f3a34;
    --ink-dim: #a3b2a8;
    --ink: #c9d6cd;
    --phosphor: #8df0a8;
    --amber: #f2c14e;
    --paper-seq: #d9ecc9;
    --paper-seq-edge: #b9d6a5;
    --paper-hold: #efe3a0;
    --paper-hold-edge: #d8c873;
    --paper-ink: #1c261f;
    --paper-ink-dim: #36423a;
    --paper-rule: rgba(28, 38, 31, .22);
    --stamp: #9c1f18;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: var(--mono);
    font-size: 15px;
    line-height: 1.4;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }

  /* Header */
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 8px 0 14px; border-bottom: 1px solid var(--rail); }
  .brand h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .06em; color: #e8f1eb; text-transform: uppercase; }
  .brand p { margin: 2px 0 0; font-size: 12px; color: var(--ink-dim); letter-spacing: .04em; }
  .clock { text-align: right; font-size: 11px; color: var(--ink-dim); letter-spacing: .08em; white-space: nowrap; }
  .clock b { display: block; font-size: 18px; color: var(--phosphor); font-weight: 600; letter-spacing: .04em; }

  /* Brain dump */
  .intake { margin-top: 18px; }
  .label { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .14em; color: var(--ink-dim); text-transform: uppercase; margin-bottom: 6px; }
  textarea {
    width: 100%; min-height: 168px; resize: vertical;
    background: #0f1512; color: var(--phosphor);
    border: 1px solid var(--rail-hi); border-radius: 6px;
    padding: 12px; font: 15px/1.5 var(--mono);
    caret-color: var(--phosphor);
  }
  textarea::placeholder { color: #7f9488; }
  textarea:focus { outline: 2px solid #3f7d55; outline-offset: 1px; }
  .btn {
    appearance: none; border: 0; cursor: pointer; font: 600 14px var(--mono); letter-spacing: .12em; text-transform: uppercase;
    border-radius: 6px; padding: 14px 16px; min-height: 48px;
  }
  .btn-primary { width: 100%; margin-top: 10px; background: var(--phosphor); color: #06200f; }
  .btn-primary:active { transform: translateY(1px); }
  .btn-primary[disabled] { background: #2d4436; color: #b8cdbf; cursor: progress; }
  .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--rail-hi); padding: 10px 12px; min-height: 40px; font-size: 12px; }
  .err { margin-top: 10px; padding: 10px 12px; border: 1px solid #6b2a24; background: #2a1513; color: #ffb4a8; border-radius: 6px; font-size: 13px; }

  /* Tower transmission */
  .tower { margin-top: 18px; border: 1px solid var(--rail-hi); border-radius: 6px; background: #0f1512; padding: 12px; }
  .tower .label { margin-bottom: 8px; }
  .tower .freq { color: var(--amber); }
  .tower blockquote { margin: 0; color: var(--phosphor); font-size: 17.5px; line-height: 1.55; }
  .tower-actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .btn-ghost[disabled] { color: var(--ink-dim); border-color: var(--rail); cursor: default; }
  .tower-actions .status { font-size: 11px; color: var(--ink-dim); letter-spacing: .08em; text-transform: uppercase; }
  .tx { display: inline-flex; align-items: center; gap: 6px; margin-right: 8px; }
  .tx::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--rail-hi); }
  .tx.on { color: #ff7a6b; }
  .tx.on::before { background: #ff5a4a; box-shadow: 0 0 6px #ff5a4a; animation: txpulse 1s ease-in-out infinite; }
  @keyframes txpulse { 50% { opacity: .3; box-shadow: none; } }
  #board.loading > :not(.tower), #board.loading .tower-actions { display: none; }

  /* Strip bays */
  .bay { margin-top: 20px; }
  .bay-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px 6px; border-bottom: 2px solid var(--rail-hi); margin-bottom: 8px; }
  .bay-head h2 { margin: 0; font-size: 13px; letter-spacing: .2em; color: #e8f1eb; }
  .bay-head span { font-size: 11px; color: var(--ink-dim); letter-spacing: .08em; }
  .rack { background: var(--bay); border-radius: 6px; padding: 6px; display: grid; gap: 6px; box-shadow: inset 0 0 0 1px var(--rail); }
  .empty { padding: 14px; font-size: 12px; color: var(--ink-dim); text-align: center; letter-spacing: .06em; }

  .strip {
    position: relative; display: grid;
    grid-template-columns: 44px 1fr auto;
    min-height: 74px;
    background: var(--paper-seq); color: var(--paper-ink);
    border-radius: 3px;
    border-left: 6px solid var(--paper-seq-edge);
    box-shadow: 0 1px 0 rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.35);
    transition: opacity .35s ease, transform .35s ease;
  }
  .strip.hold { background: var(--paper-hold); border-left-color: var(--paper-hold-edge); }
  .strip > div { padding: 8px; }
  .strip .no { border-right: 1px solid var(--paper-rule); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .strip .no b { font-size: 20px; font-weight: 700; line-height: 1; }
  .strip .no small { font-size: 9px; letter-spacing: .1em; color: var(--paper-ink-dim); }
  .strip .main { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  .strip .cs { font-size: 17px; font-weight: 700; letter-spacing: .05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip .task { font-size: 13px; color: var(--paper-ink-dim); overflow-wrap: anywhere; }
  .strip .meta { display: flex; gap: 10px; font-size: 11px; letter-spacing: .06em; color: var(--paper-ink-dim); text-transform: uppercase; flex-wrap: wrap; }
  .strip .meta .note { color: #7a5a00; }
  .strip .act { border-left: 1px solid var(--paper-rule); display: flex; align-items: center; }
  .land {
    appearance: none; cursor: pointer; border: 1.5px solid var(--paper-ink); background: transparent; color: var(--paper-ink);
    font: 700 11px var(--mono); letter-spacing: .12em; padding: 0 10px; height: 40px; border-radius: 4px; text-transform: uppercase;
  }
  .land:active { background: var(--paper-ink); color: var(--paper-seq); }
  .strip.cleared { box-shadow: 0 0 0 2px var(--phosphor), 0 2px 10px rgba(141,240,168,.25); }
  .strip.cleared .no small { color: #1d6b34; font-weight: 700; }
  .strip.promoted .no small { color: #1d6b34; }

  .strip.landed { opacity: .8; }
  .strip.landed .cs, .strip.landed .task { text-decoration: line-through; text-decoration-thickness: 2px; }
  .strip.landed .act { visibility: hidden; }
  .strip.landed::after {
    content: "LANDED"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%) rotate(-8deg);
    border: 2px solid var(--stamp); color: var(--stamp); font: 700 13px var(--mono); letter-spacing: .18em; padding: 2px 6px; border-radius: 3px;
  }
  .strip.leaving { opacity: 0; transform: translateX(24px); }

  details.landed-bay { margin-top: 20px; }
  details.landed-bay summary { cursor: pointer; font-size: 12px; letter-spacing: .16em; color: var(--ink-dim); padding: 6px 2px; list-style: none; }
  details.landed-bay summary::-webkit-details-marker { display: none; }
  details.landed-bay summary::before { content: "▸ "; }
  details.landed-bay[open] summary::before { content: "▾ "; }

  .board-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 22px; }
  .board-actions .stamp { font-size: 11px; color: var(--ink-dim); letter-spacing: .06em; }

  .scanning { display: inline-block; width: 1ch; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .boot { margin-top: 28px; font-size: 12px; letter-spacing: .14em; color: var(--ink-dim); text-transform: uppercase; }
  .toast {
    position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #2a1513; color: #ffb4a8; border: 1px solid #6b2a24; border-radius: 6px; padding: 10px 14px;
    font-size: 12px; letter-spacing: .04em; max-width: calc(100% - 32px);
  }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .strip { transition: none; } .scanning, .tx.on::before { animation: none; } }
  @media (min-width: 480px) { .strip { grid-template-columns: 52px 1fr auto; } .strip .cs { font-size: 18px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Cleared To Do</h1>
      <p>your tasks, cleared to land</p>
    </div>
    <div class="clock" aria-label="Current time UTC"><b id="zulu">----Z</b>TWR · ACTIVE</div>
  </header>

  <div id="boot" class="boot">Contacting tower<span class="scanning">_</span></div>

  <section id="intake" class="intake hidden">
    <div class="label"><label for="dump">Brain dump · all traffic</label><span id="count">0/2000</span></div>
    <textarea id="dump" maxlength="2000" placeholder="laundry, call mum back, taxes at some point, reply to Sam's email before 5, maybe learn spanish, buy milk"></textarea>
    <button id="request" class="btn btn-primary" type="button">Request clearance</button>
    <div id="error" class="err hidden" role="alert"></div>
  </section>

  <section id="board" class="hidden" aria-live="polite">
    <div class="tower">
      <div class="label"><span><span class="tx" id="tx" aria-hidden="true">TX</span>Tower transmission</span><span class="freq">118.300</span></div>
      <blockquote id="transmission"></blockquote>
      <div class="tower-actions" id="tower-actions"></div>
    </div>

    <div class="bay">
      <div class="bay-head"><h2>SEQUENCE</h2><span id="seq-meta"></span></div>
      <div class="rack" id="seq"></div>
    </div>

    <div class="bay">
      <div class="bay-head"><h2>HOLDING</h2><span id="hold-meta"></span></div>
      <div class="rack" id="hold"></div>
    </div>

    <details class="landed-bay" id="landed-bay">
      <summary id="landed-summary">LANDED</summary>
      <div class="rack" id="landed"></div>
    </details>

    <div class="board-actions">
      <span class="stamp" id="stamp"></span>
      <button class="btn btn-ghost" id="new-board" type="button">New board</button>
    </div>
  </section>
  <div id="toast" class="toast hidden" role="status"></div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const els = {
    intake: $('intake'), dump: $('dump'), count: $('count'), request: $('request'), error: $('error'),
    board: $('board'), transmission: $('transmission'), towerActions: $('tower-actions'), tx: $('tx'),
    seq: $('seq'), hold: $('hold'), landed: $('landed'), landedBay: $('landed-bay'), landedSummary: $('landed-summary'),
    seqMeta: $('seq-meta'), holdMeta: $('hold-meta'), stamp: $('stamp'), newBoard: $('new-board'),
  };

  let board = null;

  // Anonymous device ID: no login, boards are keyed by this.
  const OWNER = (() => {
    const ok = (v) => typeof v === 'string' && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v);
    let id = null;
    try { id = localStorage.getItem('ctd_owner'); } catch {}
    if (!ok(id)) {
      id = crypto.randomUUID();
      try { localStorage.setItem('ctd_owner', id); } catch {}
    }
    return id;
  })();

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), 4000);
  }

  // --- Zulu clock ---
  const tick = () => {
    const d = new Date();
    els.zulu = els.zulu || $('zulu');
    els.zulu.textContent = String(d.getUTCHours()).padStart(2, '0') + String(d.getUTCMinutes()).padStart(2, '0') + 'Z';
  };
  tick(); setInterval(tick, 15000);

  // --- helpers ---
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const est = (m) => `${Math.floor(m / 60)}+${String(m % 60).padStart(2, '0')}`;
  const showError = (msg) => { els.error.textContent = msg; els.error.classList.toggle('hidden', !msg); };

  els.dump.addEventListener('input', () => { els.count.textContent = `${els.dump.value.length}/2000`; });

  // --- rendering ---
  function stripHTML(f, pos, opts = {}) {
    const lane = f.lane === 'hold' ? 'hold' : 'seq';
    const classes = ['strip', lane];
    if (f.landed) classes.push('landed');
    if (opts.cleared) classes.push('cleared');
    if (f.promoted) classes.push('promoted');
    let no, sub;
    if (f.landed) { no = '✓'; sub = 'DOWN'; }
    else if (lane === 'seq') { no = String(pos).padStart(2, '0'); sub = opts.cleared ? 'CLRD' : (f.promoted ? 'PROM' : 'SEQ'); }
    else { no = 'H' + pos; sub = 'HOLD'; }
    const note = lane === 'hold' && f.note ? `<span class="note">${esc(f.note)}</span>` : '';
    return `<article class="${classes.join(' ')}" data-id="${esc(f.id)}">
      <div class="no"><b>${esc(no)}</b><small>${sub}</small></div>
      <div class="main">
        <div class="cs">${esc(f.callsign)}</div>
        <div class="task">${esc(f.task)}</div>
        <div class="meta"><span>EST ${est(f.minutes)}</span>${note}</div>
      </div>
      <div class="act"><button class="land" type="button" data-land="${esc(f.id)}" aria-label="Mark ${esc(f.callsign)} landed">Landed</button></div>
    </article>`;
  }

  function render() {
    document.getElementById('boot')?.remove();
    if (!board) {
      els.board.classList.add('hidden');
      els.intake.classList.remove('hidden');
      return;
    }
    els.intake.classList.add('hidden');
    els.board.classList.remove('hidden');
    els.transmission.textContent = board.transmission;

    const active = board.flights.filter((f) => !f.landed);
    const seq = active.filter((f) => f.lane === 'seq');
    const hold = active.filter((f) => f.lane === 'hold');
    const landed = board.flights.filter((f) => f.landed);

    els.seq.innerHTML = seq.length
      ? seq.map((f, i) => stripHTML(f, i + 1, { cleared: i === 0 })).join('')
      : `<div class="empty">${hold.length ? 'Runway clear.' : 'All traffic landed. Runway clear. Good day.'}</div>`;
    els.hold.innerHTML = hold.length
      ? hold.map((f, i) => stripHTML(f, i + 1)).join('')
      : '<div class="empty">Holding stack empty.</div>';
    els.landed.innerHTML = landed.map((f) => stripHTML(f, 0)).join('');
    els.landedBay.classList.toggle('hidden', !landed.length);
    els.landedSummary.textContent = `LANDED · ${landed.length}`;

    const mins = (list) => list.reduce((a, f) => a + f.minutes, 0);
    els.seqMeta.textContent = seq.length ? `${seq.length} ACFT · EST ${est(mins(seq))}` : '';
    els.holdMeta.textContent = hold.length ? `${hold.length} ACFT` : '';
    const t = new Date(board.createdAt || Date.now());
    els.stamp.textContent = `ISSUED ${String(t.getUTCHours()).padStart(2, '0')}${String(t.getUTCMinutes()).padStart(2, '0')}Z ${t.toISOString().slice(0, 10)}`;
  }

  // --- landing ---
  function land(id) {
    const f = board?.flights.find((x) => x.id === id);
    if (!f || f.landed) return;
    const el = document.querySelector(`.strip[data-id="${CSS.escape(id)}"]`);
    const finish = () => {
      f.landed = true;
      f.landedAt = new Date().toISOString();
      // If the sequence is now empty, promote the top of the holding stack.
      const active = board.flights.filter((x) => !x.landed);
      if (!active.some((x) => x.lane === 'seq')) {
        const next = active.find((x) => x.lane === 'hold');
        if (next) { next.lane = 'seq'; next.promoted = true; }
      }
      render();
      onBoardChanged();
    };
    if (el && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      el.classList.add('landed');
      setTimeout(() => { el.classList.add('leaving'); setTimeout(finish, 300); }, 450);
    } else finish();
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-land]');
    if (b) land(b.getAttribute('data-land'));
  });

  // --- Tower radio (ElevenLabs audio, played through a VHF-style filter) ---
  const radio = { ctx: null, bytes: null, buffer: null, source: null, el: null, state: 'idle', boardId: null };

  // Must run synchronously inside the click so iOS/Safari allow the later autoplay.
  function unlockAudio() {
    // iOS 17+: play through the ringer/silent switch like a media player would.
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!radio.ctx) radio.ctx = new AC();
    if (radio.ctx.state === 'suspended') radio.ctx.resume();
    const b = radio.ctx.createBuffer(1, 1, 22050);
    const s = radio.ctx.createBufferSource();
    s.buffer = b; s.connect(radio.ctx.destination); s.start(0);
  }

  function squelch(ctx, at, dur, out) {
    const n = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    const d = n.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = ctx.createBufferSource();
    const g = ctx.createGain(); g.gain.value = 0.12;
    src.buffer = n; src.connect(g).connect(out); src.start(at);
  }

  function stopRadio() {
    try { radio.source?.stop(); } catch {}
    radio.source = null;
    radio.el?.pause();
  }

  async function playRadio() {
    stopRadio();
    const ctx = radio.ctx;
    if (!radio.bytes) return false;
    if (ctx && !radio.buffer) {
      try { radio.buffer = await new Promise((res, rej) => ctx.decodeAudioData(radio.bytes.slice(0), res, rej)); }
      catch (err) { console.warn('[CTD] decode failed', err); }
    }
    if (ctx && radio.buffer) {
      if (ctx.state === 'suspended') ctx.resume();
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 320;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3300;
      const pk = ctx.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = 1700; pk.gain.value = 5;
      const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -24; comp.ratio.value = 6;
      const out = ctx.createGain(); out.gain.value = 1.4;
      hp.connect(lp).connect(pk).connect(comp).connect(out).connect(ctx.destination);
      const t = ctx.currentTime + 0.05;
      squelch(ctx, t, 0.12, out);
      const src = ctx.createBufferSource();
      src.buffer = radio.buffer; src.connect(hp); src.start(t + 0.1);
      squelch(ctx, t + 0.12 + radio.buffer.duration, 0.18, out);
      src.onended = () => { if (radio.source === src) setRadio('ready'); };
      radio.source = src;
      setRadio('playing');
      return ctx.state === 'running';
    }
    if (!radio.el) {
      radio.el = new Audio(URL.createObjectURL(new Blob([radio.bytes], { type: 'audio/mpeg' })));
      radio.el.onended = () => setRadio('ready');
    }
    setRadio('playing');
    return radio.el.play().then(() => true, () => { setRadio('ready'); return false; });
  }

  function resetRadio() {
    stopRadio();
    if (radio.el?.src) URL.revokeObjectURL(radio.el.src);
    Object.assign(radio, { bytes: null, buffer: null, el: null, boardId: null });
    setRadio('idle');
  }

  function setRadio(state) {
    radio.state = state;
    const label = {
      idle: '', loading: 'Receiving<span class="scanning">_</span>', ready: 'On frequency',
      playing: 'Transmitting<span class="scanning">_</span>', failed: 'Radio failure · read the strips', blocked: 'Tap to listen',
    }[state] || '';
    const canPlay = state === 'ready' || state === 'blocked' || state === 'playing';
    els.towerActions.innerHTML =
      `<button class="btn btn-ghost" id="replay" type="button" ${canPlay ? '' : 'disabled'}>${state === 'playing' ? '■ Stop' : '▶ ' + (state === 'blocked' ? 'Play' : 'Replay')}</button>` +
      `<span class="status">${label}</span>`;
    updateTx();
  }

  // --- TX indicator + stand-by chatter while the tower works out the board ---
  let towerBusy = false;
  let standbyTimer = null;
  const STANDBY = ['Stand by...', 'Checking the sequence...', 'Traffic in sight...', 'Sequencing traffic...', 'Copy your intentions...', 'Clearing the runway...'];
  function updateTx() { els.tx.classList.toggle('on', towerBusy || radio.state === 'playing'); }

  function startStandby() {
    let i = 0;
    towerBusy = true;
    els.board.classList.remove('hidden');
    els.board.classList.add('loading');
    els.board.setAttribute('aria-busy', 'true');
    els.transmission.textContent = STANDBY[0];
    clearInterval(standbyTimer);
    standbyTimer = setInterval(() => { els.transmission.textContent = STANDBY[++i % STANDBY.length]; }, 2000);
    updateTx();
    els.board.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function stopStandby() {
    clearInterval(standbyTimer);
    standbyTimer = null;
    towerBusy = false;
    els.board.classList.remove('loading');
    els.board.removeAttribute('aria-busy');
    updateTx();
  }

  els.towerActions.addEventListener('click', (e) => {
    if (!e.target.closest('#replay')) return;
    unlockAudio();
    if (radio.state === 'playing') { stopRadio(); setRadio('ready'); } else playRadio();
  });

  // One ElevenLabs call per board: the server caches the MP3 in Postgres after the first request.
  async function loadVoice(b) {
    resetRadio();
    radio.boardId = b.id;
    setRadio('loading');
    try {
      const r = await fetch('/api/voice', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ owner: OWNER, id: b.id }),
      });
      if (!r.ok) throw new Error(`voice HTTP ${r.status}`);
      const bytes = await r.arrayBuffer();
      if (radio.boardId !== b.id) return false; // board changed meanwhile
      radio.bytes = bytes;
      setRadio('ready');
      return true;
    } catch (err) {
      console.warn('[CTD] voice failed', err);
      if (radio.boardId === b.id) setRadio('failed');
      return false;
    }
  }

  // --- persistence (Neon via /api/boards) ---
  let saveChain = Promise.resolve();
  function onBoardChanged() {
    if (!board?.id) return;
    const payload = JSON.stringify({ owner: OWNER, id: board.id, flights: board.flights });
    saveChain = saveChain.then(() =>
      fetch('/api/boards', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: payload })
        .then((r) => { if (!r.ok) throw new Error(`save HTTP ${r.status}`); })
        .catch((err) => { console.warn('[CTD] save failed', err); showToast('Tower log offline · progress not saved'); })
    );
  }

  async function onBoardCreated() {
    if (await loadVoice(board)) {
      const ok = await playRadio();
      if (!ok) setRadio('blocked');
    }
  }

  async function restore() {
    try {
      const r = await fetch(`/api/boards?owner=${encodeURIComponent(OWNER)}`, { cache: 'no-store' });
      const data = await r.json();
      if (r.ok && data.board) {
        board = data.board;
        render();
        loadVoice(board); // cached audio; no autoplay on reload
        return;
      }
    } catch (err) {
      console.warn('[CTD] restore failed', err);
    }
    render();
  }

  // --- request clearance ---
  els.request.addEventListener('click', async () => {
    const text = els.dump.value.trim();
    if (!text) { showError('Say intentions: brain-dump at least one task.'); return; }
    unlockAudio();
    showError('');
    els.request.disabled = true;
    els.request.innerHTML = 'Contacting tower<span class="scanning">_</span>';
    startStandby();
    try {
      const r = await fetch('/api/clearance', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, owner: OWNER }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data.board) throw new Error(data.error || `Tower unavailable (HTTP ${r.status}).`);
      stopStandby();
      board = data.board;
      render();
      onBoardCreated();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
      stopStandby();
      els.board.classList.add('hidden');
      showError(err.message || 'Frequency congested, try again.');
    } finally {
      els.request.disabled = false;
      els.request.textContent = 'Request clearance';
    }
  });

  els.newBoard.addEventListener('click', () => {
    resetRadio();
    if (board?.id) {
      fetch('/api/boards', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ owner: OWNER, id: board.id, archived: true }),
      }).catch(() => {});
    }
    board = null;
    els.dump.value = '';
    els.count.textContent = '0/2000';
    render();
    els.dump.focus();
  });

  restore();
})();
</script>
</body>
</html>
